# Fork-only pre-validation for scylladb/scylladb#31204. NOT part of the PR.
#
# Lives only on the ci/31204-fork-validate branch of sankalpsthakur/scylladb, which is
# fix/31204-bloom-spec-trivial-case plus this one commit. Never add it to the PR branch.
#
# Run: push fix/31204-bloom-spec-trivial-case to the fork FIRST (the job checks out REF),
# then push ci/31204-fork-validate; that push triggers the workflow. To run it again:
#   gh run rerun <run-id> -R sankalpsthakur/scylladb
#
# What it does: copies read-toolchain.yaml + build-scylla.yaml (frozen toolchain container,
# ./configure.py, ninja), but builds only build/dev/test/boost/bloom_filter_test. With the fix it
# runs the new case once, 100 times (per .github/copilot-instructions.md), and the whole binary
# once, all directly (test.py needs docker). Then it restores the pre-fix
# utils/bloom_calculations.hh (HEAD~1, so the fix must be the tip commit of REF), rebuilds
# incrementally, and requires the new case to FAIL with the swapped spec (K=2, 1 bucket per
# element) in its assertion message. That gives fail-before/pass-after evidence for the PR.
#
# Expected runtime on ubuntu-latest: ~30 min, nearly all of it the first dev build (the #31207
# job, which builds the same target, took 29 min). -j is capped at nproc to lower OOM risk.
name: "fork bloom_filter_test (#31204)"

# Fork-only: runs on push to this CI branch and tests REF (the PR branch, whose tip is the fix).
on:
  push:
    branches:
      - ci/31204-fork-validate
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REF: fix/31204-bloom-spec-trivial-case
  MODE: dev
  TEST_CASE: test_compute_bloom_spec_for_high_fp_chance
  # Same arguments test.py uses for this test: test/pylib/cpp/base.py DEFAULT_SCYLLA_ARGS,
  # test/boost/test_config.yaml custom_args (-c1) and extra_scylla_cmdline_options.
  SEASTAR_ARGS: >-
    --overprovisioned --unsafe-bypass-fsync=1 --kernel-page-cache=1
    --blocked-reactor-notify-ms=2000000 --max-networking-io-control-blocks=1000
    -c1 --reactor-backend=linux-aio

jobs:
  # Same as .github/workflows/read-toolchain.yaml, but reads the image of the tested ref.
  read-toolchain:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.REF }}
          sparse-checkout: tools/toolchain/image
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          image=$(cat tools/toolchain/image)
          echo "image=$image" >> $GITHUB_OUTPUT

  bloom-filter-test:
    needs:
      - read-toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 330
    container: ${{ needs.read-toolchain.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.REF }}
          fetch-depth: 2
          submodules: false
      # .gitmodules uses relative URLs (../seastar, ../abseil-cpp, ...), which resolve to the fork's
      # owner and do not exist there. Point them back at the scylladb org.
      - name: Fetch submodules from the scylladb org
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/scylladb/".insteadOf "https://github.com/${{ github.repository_owner }}/"
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1 --jobs 4
          git submodule status --recursive
      - name: Generate the building system
        run: |
          git config --global --add safe.directory '*'
          git log -2 --format='%h %s'
          ./configure.py --mode $MODE
      - name: Build bloom_filter_test (with the fix)
        run: |
          ninja -j $(nproc) build/$MODE/test/boost/bloom_filter_test
      - name: Run the new case once, directly (with the fix, must pass)
        run: |
          build/$MODE/test/boost/bloom_filter_test --catch_system_errors=no --color_output=false \
            --run_test=$TEST_CASE -- $SEASTAR_ARGS
      # test.py starts dockerized 3rd-party services (S3 mock) at session start, which fails inside
      # this container (no docker), so run the boost binary directly.
      - name: Run the new case 100 times directly (with the fix, must pass)
        run: |
          for i in $(seq 1 100); do
            build/$MODE/test/boost/bloom_filter_test --catch_system_errors=no --color_output=false \
              --run_test=$TEST_CASE -- $SEASTAR_ARGS > run.log 2>&1 || { echo "run $i failed"; cat run.log; exit 1; }
          done
          echo "100/100 runs passed"
      - name: Run the whole bloom_filter_test binary directly (with the fix, must pass)
        run: |
          build/$MODE/test/boost/bloom_filter_test --catch_system_errors=no --color_output=false -- $SEASTAR_ARGS
      - name: Restore the pre-fix utils/bloom_calculations.hh and rebuild (incremental)
        run: |
          git checkout HEAD~1 -- utils/bloom_calculations.hh
          git status --short
          git diff HEAD -- utils/bloom_calculations.hh
          ninja -j $(nproc) build/$MODE/test/boost/bloom_filter_test
      - name: Run the new case without the fix (must fail with the swapped spec)
        run: |
          set +e
          build/$MODE/test/boost/bloom_filter_test --catch_system_errors=no --color_output=false \
            --run_test=$TEST_CASE -- $SEASTAR_ARGS > prefix.log 2>&1
          rc=$?
          set -e
          cat prefix.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::the new test passed without the fix"
            exit 1
          fi
          if ! grep -qF "= (K=2, buckets_per_element=1), expected (K=1, buckets_per_element=2)" prefix.log; then
            echo "::error::the new test failed without the fix, but not with the swapped spec in its message"
            exit 1
          fi
          echo "Without the fix the new test fails with the swapped spec (rc=$rc)."
